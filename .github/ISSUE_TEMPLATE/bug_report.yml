name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config
      description: Your jazzer config, if you have one (JSON, TypeScript or package.json).
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `node --version`, `npx jazzer --version` and your OS.
    validations:
      required: true
