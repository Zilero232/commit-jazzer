name: Checks

# Pull requests and pushes to main are verified and tested. A push to main that passes is released:
# semantic-release reads the commits since the last tag, bumps the version, publishes to npm (trusted
# publishing, no token), tags, updates CHANGELOG.md and creates a GitHub release.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# The repo's own git hooks (husky) have no business in CI: the release commit would run lint-staged and tests.
env:
  HUSKY: 0

concurrency:
  group: checks-${{ github.ref }}
  # Never cancel a release half-way on main; on branches the newest push wins.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Typecheck, lint, format, spelling, unused code, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - run: bun run verify
      # publint runs as part of the build and fails it on packaging mistakes.
      - run: bun run build

      # The build tools need a newer Node than the lowest one the package supports, so the
      # matrix below tests this build instead of making its own.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist

  test:
    name: Test on Node ${{ matrix.node }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The lowest supported version (engines), the active LTS and the current release.
        node: ['22.13', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - run: bun run test:coverage

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # The published CLI on this Node version, without a terminal: every required answer comes from a flag.
      - name: Smoke test the CLI
        run: |
          node dist/cli.mjs --version
          node dist/cli.mjs --dry-run -t feat -s ci -m "smoke test" -i 7 | tee message.txt
          printf 'feat(ci): ✨ smoke test\n\nCloses #7\n' | diff - message.txt
          node -e "require('./index.cjs').prompter.constructor.name === 'AsyncFunction' || process.exit(1)"

  release:
    name: Release
    needs: [verify, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Tags, the CHANGELOG.md commit, the GitHub release and the comments all go through GH_TOKEN,
    # so the job token itself needs no write access.
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: 'false'

      # `npm publish` builds again through prepublishOnly, after the version bump, so --version is right.
      - name: Semantic Release
        run: bunx semantic-release
        env:
          # A fine-grained token for this repository: Contents, Issues and Pull requests read/write. It must be
          # allowed to push to main, because the release commit updates CHANGELOG.md and package.json.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
